services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d messenger"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./messenger
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/messenger
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  android-build:
    build:
      context: ./messenger-app
      dockerfile: Dockerfile
    volumes:
      - ./messenger-app/build-output:/output
    # This service runs once and exits after copying the APK to the volume
    restart: "no"
